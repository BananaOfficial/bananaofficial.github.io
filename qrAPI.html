<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub QR Generator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f6f6;
      color: #18181b;
    }

    .container {
      max-width: 760px;
      margin: 60px auto;
      padding: 0 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 30px;
      color: #666;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input[type="text"] {
      width: 100%;
      height: 42px;
      border: 1px solid #ccc;
      border-radius: 7px;
      padding: 0 12px;
      font: inherit;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #888;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-input {
      width: 42px;
      height: 42px;
      padding: 3px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
      cursor: pointer;
    }

    .color-value {
      font-family: monospace;
      font-size: 14px;
    }

    button {
      height: 42px;
      border: 0;
      border-radius: 7px;
      padding: 0 18px;
      background: #18181b;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #303033;
    }

    .result {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 20px;
      margin-top: 24px;
      align-items: center;
    }

    .result input {
      width: 100%;
      height: 42px;
      border: 1px solid #ccc;
      border-radius: 7px;
      padding: 0 12px;
      font-family: monospace;
      font-size: 13px;
      background: #f8f8f8;
    }

    .qr {
      width: 160px;
      height: 160px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px;
      background: white;
      object-fit: contain;
      display: none;
    }

    .error {
      margin-top: 15px;
      color: #b42318;
      font-size: 14px;
      display: none;
    }

    .testing {
      margin-top: 35px;
    }

    .testing h2 {
      font-size: 18px;
      margin: 0 0 8px;
    }

    .testing p {
      margin: 0 0 15px;
      color: #666;
      font-size: 14px;
    }

    code {
      background: #eee;
      padding: 2px 5px;
      border-radius: 4px;
    }

    @media (max-width: 600px) {
      .form,
      .result {
        grid-template-columns: 1fr;
      }

      .qr {
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>GitHub QR Generator</h1>
    <p class="subtitle">
      Generate a QR code for a GitHub profile.
    </p>

    <div class="card">
      <div class="form">
        <div>
          <label for="color">Color</label>

          <div class="color-row">
            <input
              id="color"
              class="color-input"
              type="color"
              value="#000000"
              title="Choose QR color"
            >

            <span id="colorValue" class="color-value">#000000</span>
          </div>
        </div>

        <div>
          <label for="username">Username</label>

          <input
            id="username"
            type="text"
            placeholder="octocat"
            autocomplete="off"
          >
        </div>

        <button id="generate" type="button">
          Generate
        </button>
      </div>

      <div class="result">
        <div>
          <label for="generatedUrl">Generated URL</label>

          <input
            id="generatedUrl"
            type="text"
            readonly
            placeholder="Your QR URL will appear here"
          >
        </div>

        <img
          id="qr"
          class="qr"
          alt="Generated QR code"
        >
      </div>

      <div id="error" class="error"></div>
    </div>

    <div class="testing">
      <h2>Testing</h2>
      <p>
        Enter a GitHub username and click Generate to test the QR endpoint.
      </p>

      <p>
        API endpoint:
        <code>https://cdn.bananaofficial.workers.dev/api/qr/?user=USER&color=123456</code>
      </p>

      <p>
        The <code>color</code> parameter is optional and defaults to
        <code>000000</code>.
      </p>
    </div>
  </div>

  <script>
    const color = document.getElementById("color");
    const colorValue = document.getElementById("colorValue");
    const username = document.getElementById("username");
    const generate = document.getElementById("generate");
    const generatedUrl = document.getElementById("generatedUrl");
    const qr = document.getElementById("qr");
    const error = document.getElementById("error");

    color.addEventListener("input", () => {
      colorValue.textContent = color.value.toUpperCase();
    });

    generate.addEventListener("click", async () => {
      const user = username.value.trim();

      error.style.display = "none";
      qr.style.display = "none";
      generatedUrl.value = "";

      if (!user) {
        error.textContent = "Please enter a GitHub username.";
        error.style.display = "block";
        return;
      }

      const hex = color.value.replace("#", "").toUpperCase();

      let url =
        "https://cdn.bananaofficial.workers.dev/api/qr/?user=" +
        encodeURIComponent(user);

      if (hex !== "000000") {
        url += "&color=" + hex;
      }

      generatedUrl.value = url;

      try {
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("QR endpoint returned HTTP " + response.status);
        }

        const blob = await response.blob();
        const imageUrl = URL.createObjectURL(blob);

        qr.onload = () => URL.revokeObjectURL(imageUrl);
        qr.src = imageUrl;
        qr.style.display = "block";
      } catch (err) {
        error.textContent = "Failed to load the QR code: " + err.message;
        error.style.display = "block";
      }
    });

    username.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        generate.click();
      }
    });
  </script>
</body>
</html>
